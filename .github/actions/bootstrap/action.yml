name: "bootstrap"
description: "Bootstrap Python environment (install and configure Python version and build tools)"
inputs:
  python-version:
    description: "Version range or exact version of Python to use, using SemVer's version range syntax."
    default: 3.11.14
  pip-version:
    description: "Version of pip to be installed using pip"
    default: 26.2.2
  setuptools-version:
    description: "Version of setuptools to be installed using pip"
    default: 83.0.0
  uv-version:
    description: "Version of uv to install"
    default: "0.13.5"
outputs:
  python-version:
    description: "Version range or exact version of Python"
    value: ${{ steps.versions.outputs.python-version }}
  pip-version:
    description: "Installed version of pip"
    value: ${{ steps.versions.outputs.pip-version }}
  setuptools-version:
    description: "Installed version of setuptools"
    value: ${{ steps.versions.outputs.setuptools-version }}
  uv-version:
    description: "Requested version of uv"
    value: ${{ steps.versions.outputs.uv-version }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ inputs.uv-version }}
    - name: Install build tools
      env:
        PIP_VERSION: ${{ inputs.pip-version }}
        SETUPTOOLS_VERSION: ${{ inputs.setuptools-version }}
      run: |
        set -euo pipefail
        python -m pip install -U --no-cache-dir 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
        python -m pip install -U --no-cache-dir "pip==${PIP_VERSION}"
        python -m pip install -U --no-cache-dir "setuptools==${SETUPTOOLS_VERSION}"
      shell: bash
    - id: versions
      shell: bash
      run: |
        echo "python-version=$(echo ${{ inputs.python-version }})" >> $GITHUB_OUTPUT
        echo "pip-version=$(echo ${{ inputs.pip-version }})" >> $GITHUB_OUTPUT
        echo "setuptools-version=$(echo ${{ inputs.setuptools-version }})" >> $GITHUB_OUTPUT
        echo "uv-version=$(echo ${{ inputs.uv-version }})" >> $GITHUB_OUTPUT
